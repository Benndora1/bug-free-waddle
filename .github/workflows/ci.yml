name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Linters (ruff & prettier)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run pre-commit (ruff, prettier)
        uses: pre-commit/action@v3.0.1

  tests:
    name: Frappe v16 Server Tests
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis-cache:
        image: redis:6.2-alpine
        ports:
          - 13000:6379

      redis-queue:
        image: redis:6.2-alpine
        ports:
          - 11000:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up Node 24 & Yarn
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install system dependencies & bench
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client libmysqlclient-dev redis-tools
          npm install -g yarn
          pip install frappe-bench

      - name: Configure MariaDB
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "SET GLOBAL character_set_server = 'utf8mb4'; SET GLOBAL collation_server = 'utf8mb4_unicode_ci';"

      - name: Initialize Bench, ERPNext, and Asset Management
        run: |
          bench init --skip-redis-config-generation --frappe-branch version-16 ~/frappe-bench
          cd ~/frappe-bench
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache "redis://127.0.0.1:13000"
          bench set-config -g redis_queue "redis://127.0.0.1:11000"
          bench set-config -g redis_socketio "redis://127.0.0.1:13000"
          bench get-app erpnext --branch version-16 --resolve-deps
          bench get-app asset_management "${GITHUB_WORKSPACE}/repo"
          bench new-site test_site --mariadb-root-password root --admin-password admin --no-mariadb-socket
          bench --site test_site install-app erpnext
          bench --site test_site install-app asset_management
          bench --site test_site set-config allow_tests true

      - name: Run Asset Management Test Suite
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site run-tests --app asset_management
